<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kreutzwaldi tänava valgusfoor</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f2f2f2;
        margin: 0;
        padding: 16px;
        text-align: center;
      }
      .status {
        margin-bottom: 24px;
        font-size: 18px;
      }
      .lights {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 24px;
      }
      .signal {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .housing {
        background: #222;
        border-radius: 12px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .lamp {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        opacity: 0.15;
      }
      .lamp.on {
        opacity: 1;
        box-shadow: 0 0 16px currentColor;
      }
      .lamp[data-color="red"] {
        background: #e53935;
        color: #e53935;
      }
      .lamp[data-color="yellow"] {
        background: #fdd835;
        color: #fdd835;
      }
      .lamp[data-color="green"] {
        background: #43a047;
        color: #43a047;
      }
      .label {
        font-weight: bold;
      }
      .state {
        font-size: 13px;
        color: #555;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 12px 20px;
        margin-bottom: 28px;
      }
      .controls input[type="number"] {
        width: 90px;
        padding: 6px;
        font-size: 15px;
      }
      .controls button {
        padding: 7px 14px;
        font-size: 15px;
        cursor: pointer;
      }
      .controls label {
        font-size: 15px;
      }
      .hint {
        min-height: 1.2em;
        font-size: 14px;
        color: #2e7d32;
        margin: -16px 0 20px;
      }
      .street-container {
        position: relative;
        width: 100%;
        max-width: 1000px;
        margin: 20px auto;
      }

      .street-image {
        width: 100%;
        height: auto;
        display: block;
      }
      .street-container .signal {
        position: absolute;
        transform: translate(-50%, -50%);
        transform-origin: center;
        scale: 0.40;
      }
    </style>
    <script src="main.js" defer></script>
  </head>
  <body>
    <h1>Kreutzwaldi tänava valgusfoor</h1>
    <div class="street-container">
      <img
        src="Liiklusprojekt_tanav.png"
        alt="Picture of the street"
        style="width: 1000px; height: 600px"
      />

      <div class="lights">
        <div class="signal" id="A1" style="left: 42%; top: 60%">
          <div class="housing">
            <div class="lamp" data-color="red"></div>
            <div class="lamp" data-color="yellow"></div>
            <div class="lamp" data-color="green"></div>
          </div>
          <span class="label">A1 (auto)</span>
          <span class="state"></span>
        </div>

        <div class="signal" id="A7" style="left: 70%; top: 45%">
          <div class="housing">
            <div class="lamp" data-color="red"></div>
            <div class="lamp" data-color="yellow"></div>
            <div class="lamp" data-color="green"></div>
          </div>
          <span class="label">A7 (auto)</span>
          <span class="state"></span>
        </div>

        <div class="signal" id="A3" style="left: 35%; top: 45%">
          <div class="housing">
            <div class="lamp" data-color="red"></div>
            <div class="lamp" data-color="yellow"></div>
            <div class="lamp" data-color="green"></div>
          </div>
          <span class="label">A3 (auto)</span>
          <span class="state"></span>
        </div>

        <div class="signal" id="A6" style="left: 60%; top: 65%">
          <div class="housing">
            <div class="lamp" data-color="red"></div>
            <div class="lamp" data-color="yellow"></div>
            <div class="lamp" data-color="green"></div>
          </div>
          <span class="label">A6 (auto)</span>
          <span class="state"></span>
        </div>

        <div class="signal" id="J1" style="left: 35%; top: 35%">
          <div class="housing">
            <div class="lamp" data-color="red"></div>
            <div class="lamp" data-color="green"></div>
          </div>
          <span class="label">J1 (jalakäija)</span>
          <span class="state"></span>
        </div>

        <div class="signal" id="J6" style="left: 65%; top: 35%">
          <div class="housing">
            <div class="lamp" data-color="red"></div>
            <div class="lamp" data-color="green"></div>
          </div>
          <span class="label">J6 (jalakäija)</span>
          <span class="state"></span>
        </div>
      </div>
    </div>

    <div class="status">
      Faas: <strong id="phaseName">-</strong> · Aega jäänud:
      <strong id="timeLeft">-</strong>
    </div>

    <div class="controls">
      <span>
        <label for="greenTime">Rohelise aeg (s)</label>
        <input type="number" id="greenTime" min="5" max="120" value="15" />
        <button type="button" id="greenTimeBtn">Muuda</button>
      </span>
      <label>
        <input type="checkbox" id="nightToggle" />
        Öörežiim (vilkuv kollane)
      </label>
      <button type="button" id="pedestrianBtn">Lase jalakäija läbi</button>
    </div>
    <p class="hint" id="hint"></p>
  </body>
</html>
